<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1eefc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13111d" media="(prefers-color-scheme: dark)">
<title>Chirkle</title>
<script>try{const t=localStorage.getItem("chat.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch{}</script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<!--CSS-->
</head>
<body>
<div id="app"><header class="app-bar"><span class="brand">Chirkle</span></header><main class="app-main"></main></div>
<!--JS-->
</body>
</html>
