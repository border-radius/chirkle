<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1eefc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<title>Usage statistics</title>
<script>try{const t=localStorage.getItem("chat.theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch{}</script>
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<!--CSS-->
</head>
<body>
<header class="stats-bar">
<a class="brand" href="/">Chirkle</a>
<h1>Usage statistics</h1>
<span id="stats-updated" class="stats-updated" aria-live="polite"></span>
</header>
<main id="stats" class="stats"><p class="loading">Loading…</p></main>
<!--JS-->
</body>
</html>
