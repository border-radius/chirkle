name: Setup
description: Node 22 with npm 11, the locked dependencies, Go, and the Chirkle server built (server/, PocketBase with Go hooks).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - run: npm i -g npm@11.20.0
      shell: bash
    - run: npm ci
      shell: bash

    - uses: actions/setup-go@v5
      with:
        go-version-file: server/go.mod
        cache-dependency-path: server/go.sum
    - run: npm run setup
      shell: bash
