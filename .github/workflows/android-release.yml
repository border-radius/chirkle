name: Android release

# Builds the app's release APK, signed with the release key (docs/ANDROID.md §28.2), and attaches it to the GitHub
# Release (§28.6). Pushing a tag `android-v<versionName>` makes the Release if there is none; a Release published from
# the web with any other tag but `v…` gets the APK too. A `v<version>` Release is release.yml's (§28.7): it calls this
# with the tag. The tests ran already: CI runs on every push, tags included.
on:
  push:
    tags: ["android-v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the APK to (it must exist)
        required: true
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the APK to (its Release must exist)
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}

jobs:
  apk:
    name: Build and attach the APK
    # A Release published from the web for a new android-v tag also pushes that tag: the push builds it, not this. A
    # v tag's Release is built by release.yml, which passes the tag.
    if: inputs.tag || github.event_name != 'release' || !(startsWith(github.event.release.tag_name, 'android-v') || startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The signing secrets are the "release" environment's, not the repository's: only jobs that name it see them.
    environment: release
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version
        run: |
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          name=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$code" && test -n "$name" || { echo "::error::versionCode/versionName not found in app/build.gradle.kts"; exit 1; }
          # An android-v tag names the version it releases: a forgotten bump would ship the old version under a new tag.
          if [[ "$TAG" == android-v* && "$TAG" != "android-v$name" ]]; then
            echo "::error::Tag $TAG but versionName is $name: bump app/build.gradle.kts (ANDROID.md §28.4)"; exit 1
          fi
          if [[ "$TAG" == v* && "$TAG" != "v$name" ]]; then
            echo "::error::Tag $TAG but versionName is $name: run npm run release -- ${TAG#v} (ANDROID.md §28.7)"; exit 1
          fi
          echo "CODE=$code" >> "$GITHUB_ENV"
          echo "NAME=$name" >> "$GITHUB_ENV"

      # Never the debug key: an APK signed with it could not be updated by one signed properly later.
      - name: Write the release keystore
        env:
          KEYSTORE: ${{ secrets.CHIRKLE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::Secret CHIRKLE_KEYSTORE_BASE64 is not set (ANDROID.md §28.6)"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Gradle only says "Failed to read key"; this tells which secret is wrong, without printing any of them.
      - name: Check the keystore secrets
        env:
          STORE_PW: ${{ secrets.CHIRKLE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.CHIRKLE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.CHIRKLE_KEY_PASSWORD }}
        run: |
          # A PKCS12 store (keytool's default) has one password: a different key password fails to sign.
          if [ -n "$KEY_PW" ] && [ "$KEY_PW" != "$STORE_PW" ]; then echo "::warning::CHIRKLE_KEY_PASSWORD differs from CHIRKLE_KEYSTORE_PASSWORD; for this keystore delete it"; fi
          ks="$RUNNER_TEMP/release.jks"
          test -n "$STORE_PW" || { echo "::error::Secret CHIRKLE_KEYSTORE_PASSWORD is not set"; exit 1; }
          test -n "$ALIAS" || { echo "::error::Secret CHIRKLE_KEY_ALIAS is not set"; exit 1; }
          case "$STORE_PW" in *=*) echo "::warning::CHIRKLE_KEYSTORE_PASSWORD contains '=': paste only the value, not NAME=value";; esac
          keytool -list -keystore "$ks" -storepass:env STORE_PW > /dev/null 2>&1 \
            || { echo "::error::CHIRKLE_KEYSTORE_PASSWORD does not open the keystore in CHIRKLE_KEYSTORE_BASE64 (wrong password, or the base64 was cut short)"; exit 1; }
          keytool -list -keystore "$ks" -storepass:env STORE_PW -alias "$ALIAS" > /dev/null 2>&1 \
            || { echo "::error::No key with alias CHIRKLE_KEY_ALIAS in the keystore (it is: $(keytool -list -keystore "$ks" -storepass:env STORE_PW | sed -n 's/^\([^,]*\),.*PrivateKeyEntry.*/\1/p' | head -1))"; exit 1; }
          echo "Keystore, password and alias match."

      - name: Build the release APK
        env:
          STORE_PW: ${{ secrets.CHIRKLE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.CHIRKLE_KEY_ALIAS }}
          KEY_PW: ${{ secrets.CHIRKLE_KEY_PASSWORD || secrets.CHIRKLE_KEYSTORE_PASSWORD }}
        # The properties as -P flags (the log masks secrets); Gradle's own error becomes an annotation, which the
        # run's page shows to anyone, unlike the log.
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --max-workers=2 \
            "-Pchirkle.keystore=$RUNNER_TEMP/release.jks" "-Pchirkle.keystorePassword=$STORE_PW" \
            "-Pchirkle.keyAlias=$ALIAS" "-Pchirkle.keyPassword=$KEY_PW" 2>&1 | tee "$RUNNER_TEMP/gradle.log" || {
            why=$(sed -n '/What went wrong/,/Try:/p' "$RUNNER_TEMP/gradle.log" | grep -v 'What went wrong\|Try:\|^$' | head -15 | tr '\n' ' ')
            echo "::error title=Gradle::${why:-$(tail -5 "$RUNNER_TEMP/gradle.log" | tr '\n' ' ')}"
            exit 1
          }

      - name: Check the signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then echo "::error::Signed with the debug key"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/chirkle-$NAME.apk"
          (cd "$RUNNER_TEMP/out" && sha256sum "chirkle-$NAME.apk" > "chirkle-$NAME.apk.sha256")

      - name: Attach to the Release
        run: |
          notes="../fastlane/metadata/android/en-US/changelogs/$CODE.txt"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            if [ -f "$notes" ]; then gh release create "$TAG" --verify-tag --title "Android $NAME" --notes-file "$notes"
            else gh release create "$TAG" --verify-tag --title "Android $NAME" --generate-notes; fi
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/out/chirkle-$NAME.apk" "$RUNNER_TEMP/out/chirkle-$NAME.apk.sha256" --clobber

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
