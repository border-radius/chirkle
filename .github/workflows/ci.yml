name: CI

on:
  push:
  pull_request:

# Static checks first; the test suites then run side by side, e2e once per browser. `npm run check` still runs
# everything but e2e in one go locally. The Android app (android/, docs/ANDROID.md §12) has a job of its own.
jobs:
  static:
    name: Typecheck, lint, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:sinks
      - run: npm run build

  unit:
    name: Unit tests
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm test

  xmpp:
    name: XMPP bridge child (vet, test, build)
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: xmpp-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt these"; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Every platform the npm package ships (prepack builds the same).
      - run: node ../scripts/build-xmpp.mjs --all

  integration:
    name: Integration tests
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The media worker's video posters (DESIGN.md §30.1); without it their tests are skipped locally, and fail in CI.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # An S3 server for the posters of videos kept in S3 (tests/integration/media.s3.test.ts): versitygw, checksum-verified.
      - name: Install versitygw
        run: |
          v=1.9.0
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/versity/versitygw/releases/download/v$v/versitygw_v${v}_Linux_x86_64.tar.gz"
          curl -fsSL "https://github.com/versity/versitygw/releases/download/v$v/checksums.txt" | grep "versitygw_v${v}_Linux_x86_64.tar.gz" | sha256sum -c
          tar xzf "versitygw_v${v}_Linux_x86_64.tar.gz"
          echo "VERSITYGW=$RUNNER_TEMP/versitygw_v${v}_Linux_x86_64/versitygw" >> "$GITHUB_ENV"
      - run: npm run test:int

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # One browser failing shouldn't cancel (and hide) the others' results.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Video posters (DESIGN.md §30.1): attachments.spec.ts shows one in the room.
      - run: sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm run build
      - run: npx playwright test --project=${{ matrix.browser }}
        env:
          CI: "1"
          E2E_SKIP_BUILD: "1" # built just above

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  speed:
    name: Web speed check
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      - run: npm run build
      # Loose limits (docs/PERF.md §4): a change that makes loading, switching or scrolling several times slower fails.
      - run: npm run profile:web -- --cpu=4 --check --out=profile-web.json
      - name: Upload the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-web
          path: profile-web.json
          retention-days: 30

  android:
    name: Android (check, size)
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      # The app's API and UI tests run against a real PocketBase from bin/ (ANDROID.md §13).
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Lint and every module's JVM tests: unit, data integration and Robolectric UI tests.
      - run: ./gradlew check --max-workers=2
      - run: ./gradlew :app:checkApkSize --max-workers=2

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/**/build/reports/
          retention-days: 7
