name: CI

on:
  push:
  pull_request:

# Many small jobs, all side by side and none waiting on another: a failed one shows what broke by its name and
# "Re-run failed jobs" repeats only it. The slow suites are sharded (integration, e2e per browser) and the Android
# app (android/, docs/ANDROID.md §12) has one job per step. `npm run check` still runs everything but e2e in one go
# locally.
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          server: "false"
      - run: npm run lint
      - run: npm run lint:sinks

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          server: "false"
      - run: npm run build

  go:
    name: Go vet and unit tests (server/)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - name: gofmt
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt: the files above need formatting"; exit 1; }
      - run: go test ./...

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No server: the unit project has no global setup.
      - uses: ./.github/actions/setup
        with:
          server: "false"
      - run: npx vitest run --project unit

  component:
    name: Component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx vitest run --project component

  integration:
    name: Integration tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The media worker's video posters (DESIGN.md §30.1); without it their tests are skipped locally, and fail in CI.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # An S3 server for the posters of videos kept in S3 (tests/integration/media.s3.test.ts): versitygw, checksum-verified.
      - name: Install versitygw
        run: |
          v=1.9.0
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/versity/versitygw/releases/download/v$v/versitygw_v${v}_Linux_x86_64.tar.gz"
          curl -fsSL "https://github.com/versity/versitygw/releases/download/v$v/checksums.txt" | grep "versitygw_v${v}_Linux_x86_64.tar.gz" | sha256sum -c
          tar xzf "versitygw_v${v}_Linux_x86_64.tar.gz"
          echo "VERSITYGW=$RUNNER_TEMP/versitygw_v${v}_Linux_x86_64/versitygw" >> "$GITHUB_ENV"
      # Each shard is a third of the files, still one at a time (vitest.config.ts), against its own server.
      - run: npx vitest run --project integration --shard=${{ matrix.shard }}/3

  e2e:
    name: E2E (${{ matrix.browser }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # One browser or shard failing shouldn't cancel (and hide) the others' results.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Video posters (DESIGN.md §30.1): attachments.spec.ts shows one in the room.
      - run: sudo apt-get install -y --no-install-recommends ffmpeg

      - run: npm run build
      - run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
        env:
          CI: "1"
          E2E_SKIP_BUILD: "1" # built just above

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  speed:
    name: Web speed check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium

      - run: npm run build
      # Loose limits (docs/PERF.md §4): a change that makes loading, switching or scrolling several times slower fails.
      - run: npm run profile:web -- --cpu=4 --check --out=profile-web.json
      - name: Upload the numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-web
          path: profile-web.json
          retention-days: 30

  # The Android app: `./gradlew check` (lint and every module's JVM tests) and the size check, as separate jobs.
  android-lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew lint --max-workers=2

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/**/build/reports/
          retention-days: 7

  android-test:
    # :app is the Robolectric UI tests, :core:data the unit and data integration tests; the other modules have none.
    name: Android tests (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [":app", ":core:data"]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      # The app's API and UI tests run against a real server from bin/ (ANDROID.md §13).
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ${{ matrix.module }}:test --max-workers=2

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports-${{ matrix.module == ':app' && 'app' || 'core-data' }}
          path: android/**/build/reports/
          retention-days: 7

  android-size:
    name: Android APK size
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:checkApkSize --max-workers=2

  # One check that is green only when every job above is: branch protection can require it alone, whatever the jobs.
  ci:
    name: CI passed
    if: always()
    needs: [typecheck, lint, build, go, unit, component, integration, e2e, speed, android-lint, android-test, android-size]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
