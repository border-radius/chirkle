name: Deploy

# Builds the production image on GitHub's runners, pushes it to GitHub Container Registry, and has Dokku run it
# (`dokku git:from-image`): the server only pulls layers and restarts, it builds nothing (README "Dokku").
# Runs after CI passes on master, or by hand. Without the DOKKU_SSH_KEY secret (forks) it only builds and pushes.
#
# Set up once, in the repository's Settings → Secrets and variables → Actions:
#   secret   DOKKU_SSH_KEY     a private key whose public half is in Dokku (`dokku ssh-keys:add github <key.pub>`)
#   variable DOKKU_HOST        the server, e.g. chat.example.com (an ssh port other than 22: DOKKU_PORT)
#   variable DOKKU_APP         the Dokku app, if not `chirkle`
#   variable DOKKU_KNOWN_HOSTS optional: `ssh-keyscan <host>` output, to pin the server's key (else it's scanned)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One deploy at a time; a newer push waits for the running one instead of cancelling it mid-restart.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push, deploy
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Lowercase the image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Layers are cached in GitHub's cache: a change to web/ alone skips npm ci and the PocketBase download.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Dokku
        env:
          KEY: ${{ secrets.DOKKU_SSH_KEY }}
          HOST: ${{ vars.DOKKU_HOST }}
          PORT: ${{ vars.DOKKU_PORT || '22' }}
          APP: ${{ vars.DOKKU_APP || 'chirkle' }}
          KNOWN_HOSTS: ${{ vars.DOKKU_KNOWN_HOSTS }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "::notice::DOKKU_SSH_KEY or DOKKU_HOST not set: pushed $IMAGE:$SHA, not deployed."; exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/dokku && chmod 600 ~/.ssh/dokku
          if [ -n "$KNOWN_HOSTS" ]; then printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          # The tag is the commit, so every deploy is a new image; Dokku reads app.json (health check) from the image.
          ssh -i ~/.ssh/dokku -p "$PORT" -o IdentitiesOnly=yes "dokku@$HOST" \
            git:from-image "$APP" "$IMAGE:$SHA"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/dokku
