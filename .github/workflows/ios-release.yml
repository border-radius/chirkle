name: iOS release

# Archives the iPhone app, signs it and uploads it to App Store Connect (TestFlight), docs/IOS.md §6.2. Push a tag
# `ios-v<version>` (e.g. ios-v0.1.0), or run it by hand. Signing is Xcode's automatic, cloud-managed signing with an
# App Store Connect API key: no certificate or profile is kept in the repository's secrets.
#
# The "release" environment's secrets (only jobs that name it see them):
#   APPLE_TEAM_ID      the 10-character team id (developer.apple.com → Membership)
#   ASC_KEY_ID         an App Store Connect API key's id (Users and Access → Integrations, role Admin: cloud signing
#   ASC_ISSUER_ID      makes the distribution certificate), its issuer id,
#   ASC_KEY_P8_BASE64  and its .p8 file, base64-encoded
# The app record (bundle id com.chirkle.ios) must exist in App Store Connect first.
on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version (e.g. 0.1.0); the build number is the run number
        required: true

permissions:
  contents: read

jobs:
  testflight:
    name: Archive and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 40
    environment: release
    env:
      VERSION: ${{ inputs.version || '' }}
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Read the version
        run: |
          v="${VERSION:-${GITHUB_REF_NAME#ios-v}}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "::error::Version '$v' is not like 1.2.3"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Check the secrets and write the API key
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for s in TEAM KEY_ID ISSUER P8; do
            test -n "${!s}" || { echo "::error::A signing secret is missing ($s): see the top of ios-release.yml"; exit 1; }
          done
          echo "$P8" | base64 -d > "$RUNNER_TEMP/key.p8"
          {
            echo "TEAM=$TEAM"
            echo "KEY_ID=$KEY_ID"
            echo "ISSUER=$ISSUER"
          } >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: brew install xcodegen && xcodegen

      - name: Archive
        run: |
          xcodebuild archive -project Chirkle.xcodeproj -scheme Chirkle -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Chirkle.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/key.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"

      # destination=upload: the export signs for the App Store and uploads, in one step.
      - name: Sign and upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Chirkle.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/key.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/key.p8"
