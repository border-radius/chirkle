# The Xcode project, generated by XcodeGen (`brew install xcodegen && xcodegen` in ios/), so no .xcodeproj is checked
# in (docs/IOS.md §6). CI generates it and builds the app for the simulator; ios-release.yml signs an archive.
name: Chirkle
options:
  bundleIdPrefix: com.chirkle
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
packages:
  ChirkleCore:
    path: ChirkleCore
targets:
  Chirkle:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ChirkleCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Chirkle
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Servers are anyone's: one on a LAN or in development may be plain http (as the Android app allows).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chirkle.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  Chirkle:
    build:
      targets:
        Chirkle: all
    test:
      targets: []
